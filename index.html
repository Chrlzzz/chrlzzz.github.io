<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SPLK-5001 Practice Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0d14;
    --panel: #0f1420;
    --border: #1e2d45;
    --accent: #00c8ff;
    --accent2: #ff6b35;
    --correct: #00e676;
    --wrong: #ff1744;
    --text: #c9d8e8;
    --muted: #5a7291;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 820px;
    padding: 24px 16px 60px;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 32px 0 24px;
  }
  .badge {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    border: 1px solid var(--accent);
    display: inline-block;
    padding: 4px 14px;
    margin-bottom: 14px;
    opacity: 0.8;
  }
  header h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
  }
  header h1 span { color: var(--accent); }
  .subtitle {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ── SHUFFLE TOGGLE ── */
  .shuffle-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 4px 0 18px;
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(0,200,255,0.02);
    flex-wrap: wrap;
  }
  .shuffle-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .shuffle-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-track {
    width: 40px;
    height: 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    position: relative;
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }
  .shuffle-toggle.on .toggle-track {
    border-color: var(--accent);
    background: rgba(0,200,255,0.1);
  }
  .shuffle-toggle.on .toggle-track::after {
    transform: translateX(20px);
    background: var(--accent);
  }
  .toggle-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    transition: color 0.2s;
    min-width: 28px;
  }
  .shuffle-toggle.on .toggle-text { color: var(--accent); }

  .shuffle-divider {
    width: 1px;
    height: 16px;
    background: var(--border);
  }
  .shuffle-opts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .shuffle-opt-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    text-transform: uppercase;
  }
  .shuffle-opt-btn:hover { border-color: var(--accent); color: var(--accent); }
  .shuffle-opt-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,200,255,0.08);
  }
  .shuffle-opt-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    border-color: var(--border);
    color: var(--muted);
    background: transparent;
  }

  /* shuffled indicator on card */
  .shuffle-pill {
    display: none;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--accent);
    border: 1px solid rgba(0,200,255,0.3);
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 10px;
    vertical-align: middle;
    text-transform: uppercase;
    animation: pulse-badge 2s infinite;
  }
  @keyframes pulse-badge {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ── PROGRESS ── */
  .progress-bar-wrap {
    background: var(--border);
    height: 3px;
    border-radius: 2px;
    margin: 20px 0 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #0066ff);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .progress-meta span { color: var(--accent); }

  /* ── QUESTION CARD ── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 28px 22px;
    position: relative;
    overflow: hidden;
    animation: fadeSlide 0.3s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .q-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
  }
  .q-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.6;
    color: #e4eef8;
    margin-bottom: 22px;
  }
  .q-text code {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    background: rgba(0,200,255,0.05);
    border-left: 2px solid var(--accent);
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
    color: #8ecfff;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* ── OPTIONS ── */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    background: rgba(255,255,255,0.01);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(0,200,255,0.05);
    transform: translateX(3px);
  }
  .option-letter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-width: 18px;
    margin-top: 2px;
    transition: color 0.15s;
  }
  .option.selected .option-letter { color: var(--accent); }
  .option.correct {
    border-color: var(--correct);
    background: rgba(0,230,118,0.07);
  }
  .option.correct .option-letter { color: var(--correct); }
  .option.wrong {
    border-color: var(--wrong);
    background: rgba(255,23,68,0.07);
  }
  .option.wrong .option-letter { color: var(--wrong); }
  .option.locked { cursor: default; }

  /* ── FEEDBACK ── */
  .feedback {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.6;
    animation: fadeSlide 0.2s ease;
  }
  .feedback.correct-fb {
    display: block;
    background: rgba(0,230,118,0.08);
    border: 1px solid rgba(0,230,118,0.3);
    color: #9effd1;
  }
  .feedback.correct-fb::before {
    content: '✔  CORRECT — ';
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--correct);
    font-weight: 700;
  }
  .feedback.wrong-fb {
    display: block;
    background: rgba(255,23,68,0.08);
    border: 1px solid rgba(255,23,68,0.3);
    color: #ffb3be;
  }
  .feedback.wrong-fb::before {
    content: '✘  INCORRECT — ';
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--wrong);
    font-weight: 700;
  }

  /* ── NAV ── */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 12px;
  }
  .btn {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 11px 26px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--accent); color: #000; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); color: #000; }
  .btn.primary:hover { background: #33d4ff; }
  .btn-skip {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    letter-spacing: 1px;
    padding: 0;
  }
  .btn-skip:hover { color: var(--text); }

  /* ── RESULTS ── */
  #results-screen {
    display: none;
    text-align: center;
    animation: fadeSlide 0.4s ease;
  }
  .score-ring {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 32px auto 20px;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring circle { fill: none; stroke-width: 10; }
  .score-ring .bg-c { stroke: var(--border); }
  .score-ring .fg-c {
    stroke: var(--correct);
    stroke-dasharray: 0 440;
    transition: stroke-dasharray 1.2s cubic-bezier(0.4,0,0.2,1);
  }
  .score-ring.bad .fg-c { stroke: var(--accent2); }
  .score-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .score-pct {
    font-family: var(--mono);
    font-size: 36px;
    color: #fff;
    line-height: 1;
  }
  .score-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .result-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .result-sub {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .stat-box {
    padding: 16px 24px;
    border: 1px solid var(--border);
    border-radius: 4px;
    min-width: 110px;
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
  }
  .stat-val.g { color: var(--correct); }
  .stat-val.r { color: var(--wrong); }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }

  .review-list { text-align: left; margin-top: 28px; }
  .review-item {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
  }
  .review-item.r-correct { border-color: rgba(0,230,118,0.25); }
  .review-item.r-wrong   { border-color: rgba(255,23,68,0.25); }
  .review-q-num {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .review-item.r-correct .review-q-num { color: var(--correct); }
  .review-item.r-wrong   .review-q-num { color: var(--wrong); }
  .review-q-text { color: #cde; margin-bottom: 8px; font-weight: 600; }
  .review-answers { font-family: var(--mono); font-size: 12px; }
  .review-answers .ry { color: var(--text); }
  .review-answers .rc { color: var(--correct); }

  @media (max-width: 600px) {
    .card { padding: 20px 16px; }
    .btn  { padding: 10px 18px; font-size: 13px; }
    .shuffle-bar { gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="badge">Splunk Certification Prep</div>
    <h1><span>SPLK</span>-5001 Practice Quiz</h1>
    <p class="subtitle">// 66 questions · Cybersecurity Defense Analyst</p>
  </header>

  <!-- SHUFFLE CONTROLS -->
  <div class="shuffle-bar">
    <span class="shuffle-label">// Randomize</span>
    <div class="shuffle-toggle" id="shuffle-toggle" onclick="toggleShuffle()">
      <div class="toggle-track"></div>
      <span class="toggle-text" id="toggle-text">OFF</span>
    </div>
    <div class="shuffle-divider"></div>
    <div class="shuffle-opts">
      <button class="shuffle-opt-btn active" id="opt-questions" onclick="toggleShuffleOpt('questions')" title="Shuffle question order">⇄ Questions</button>
      <button class="shuffle-opt-btn active" id="opt-choices" onclick="toggleShuffleOpt('choices')" title="Shuffle answer choices">⇄ Choices</button>
    </div>
    <div class="shuffle-divider"></div>
    <button class="btn-skip" id="btn-reshuffle" onclick="applyShuffleAndRestart()" style="display:none; font-size:10px; letter-spacing:1.5px;">↺ RE-SHUFFLE</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="prog-bar" style="width:0%"></div>
    </div>
    <div class="progress-meta">
      <span>Question <span id="q-current">1</span> of 66</span>
      <span>Score: <span id="score-live">0</span> / <span id="answered-live">0</span></span>
    </div>

    <div class="card" id="card">
      <div class="q-number" id="q-num-label">QUESTION 01</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="nav">
      <button class="btn" id="btn-prev" onclick="goQuestion(current-1)" disabled>← Prev</button>
      <button class="btn-skip" id="btn-skip" onclick="skipQuestion()">Skip →</button>
      <button class="btn primary" id="btn-next" onclick="goQuestion(current+1)" disabled>Next →</button>
    </div>
    <div style="text-align:center; margin-top:18px;">
      <button class="btn" onclick="finishQuiz()" style="border-color:var(--accent2);color:var(--accent2);">Finish &amp; See Results</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen">
    <div class="badge">Quiz Complete</div>
    <div class="score-ring" id="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle class="bg-c" cx="80" cy="80" r="70"/>
        <circle class="fg-c" id="score-circle" cx="80" cy="80" r="70"/>
      </svg>
      <div class="score-text">
        <div class="score-pct" id="score-pct">0%</div>
        <div class="score-label">Score</div>
      </div>
    </div>
    <div class="result-title" id="result-title">Results</div>
    <div class="result-sub" id="result-sub"></div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val g" id="r-correct">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-box"><div class="stat-val r" id="r-wrong">0</div><div class="stat-lbl">Incorrect</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--muted)" id="r-skipped">0</div><div class="stat-lbl">Skipped</div></div>
    </div>
    <button class="btn primary" onclick="restartQuiz()" style="margin-bottom:32px;">Restart Quiz</button>
    <div class="review-list" id="review-list"></div>
  </div>
</div>

<script>
// ─── MASTER QUESTION BANK ───────────────────────────────────────────────────
const masterQuestions = [
  {
    q: "An analysis of an organization's security posture determined that a particular asset is at risk and a new process or solution should be implemented to protect it. Typically, who would be in charge of implementing the new process or solution that was selected?",
    opts: ["Security Architect","SOC Manager","Security Engineer","Security Analyst"],
    ans: 2,
    exp: "The Security Engineer is responsible for implementing and deploying the selected solutions. The Security Architect designs and selects the tools, while analysts investigate and the SOC Manager oversees operations."
  },
  {
    q: "Which of the following is a correct Splunk search that will return results in the most performant way?",
    opts: [
      "index=foo host=i-478619733 | stats range(_time) as duration by src_ip | bin duration span=5min | stats count by duration, host",
      "| stats range(_time) as duration by src_ip | index=foo host=i-478619733 | bin duration span=5min | stats count by duration, host",
      "index=foo host=i-478619733 | transaction src_ip |stats count by host",
      "index=foo | transaction src_ip |stats count by host | search host=i-478619733"
    ],
    ans: 0,
    exp: "The most performant Splunk searches filter data as early as possible using index and host constraints before any pipe commands. Option A correctly places index=foo host=i-478619733 at the start, reducing the data set before transformations. Options B and D filter late or after pipes, which is inefficient."
  },
  {
    q: "There are many resources for assisting with SPL and configuration questions. Which of the following resources feature community-sourced answers?",
    opts: ["Splunk Answers","Splunk Lantern","Splunk Guidebook","Splunk Documentation"],
    ans: 0,
    exp: "Splunk Answers (answers.splunk.com) is Splunk's official community Q&A platform where users post questions and the community provides answers. Splunk Lantern and official Documentation are Splunk-authored resources."
  },
  {
    q: "A successful Continuous Monitoring initiative involves the entire organization. When an analyst discovers the need for more context or additional information, perhaps from additional data sources or altered correlation rules, to what role would this request generally escalate?",
    opts: ["SOC Manager","Security Analyst","Security Engineer","Security Architect"],
    ans: 2,
    exp: "Security Engineers handle the technical implementation requests such as onboarding new data sources or modifying correlation rules. Analysts identify needs, but engineers perform the technical work of adding data and building detections."
  },
  {
    q: "Splunk Enterprise Security has numerous frameworks to create correlations, integrate threat intelligence, and provide a workflow for investigations. Which framework raises the threat profile of individuals or assets to allow identification of people or devices that perform an unusual amount of suspicious activities?",
    opts: ["Threat Intelligence Framework","Risk Framework","Notable Event Framework","Asset and Identity Framework"],
    ans: 1,
    exp: "The Risk Framework in Splunk ES assigns risk scores to entities (users, hosts) based on suspicious activity. When an entity accumulates enough risk, a Risk Notable is generated, helping analysts identify high-risk individuals or devices."
  },
  {
    q: "While the top command is utilized to find the most common values contained within a field, a Cyber Defense Analyst hunts for anomalies. Which of the following Splunk commands returns the least common values?",
    opts: ["least","uncommon","rare","base"],
    ans: 2,
    exp: "The `rare` command is the direct counterpart to `top` in Splunk SPL. It returns the least common values in a field, making it useful for anomaly and threat hunting where unusual or infrequent activity is of interest."
  },
  {
    q: "The Lockheed Martin Cyber Kill Chain® breaks an attack lifecycle into several stages. A threat actor modified the registry on a compromised Windows system to ensure that their malware would automatically run at boot time. Into which phase of the Kill Chain would this fall?",
    opts: ["Act on Objectives","Exploitation","Delivery","Installation"],
    ans: 3,
    exp: "The Installation phase of the Kill Chain covers actions taken by attackers to establish persistence on the target, such as modifying the registry to ensure malware runs at startup. Exploitation is the act of triggering a vulnerability, while Act on Objectives is the final goal phase."
  },
  {
    q: "A Risk Notable Event has been triggered in Splunk Enterprise Security, an analyst investigates the alert, and determines it is a false positive. What metric would be used to define the time between alert creation and close of the event?",
    opts: ["MTTR (Mean Time to Respond)","MTBF (Mean Time Between Failures)","MTTA (Mean Time to Acknowledge)","MTTD (Mean Time to Detect)"],
    ans: 0,
    exp: "MTTR (Mean Time to Respond) measures the average time from when an alert is created to when it is resolved or closed. MTTA measures time to first acknowledgment, while MTTD measures time to detect the issue initially."
  },
  {
    q: "An analyst needs to create a new field at search time. Which Splunk command will dynamically extract additional fields as part of a Search pipeline?",
    opts: ["rex","fields","regex","eval"],
    ans: 0,
    exp: "The `rex` command uses regular expressions to extract new fields from existing field values at search time. The `fields` command selects or removes existing fields, and `eval` computes new field values from expressions rather than raw text extraction."
  },
  {
    q: "Which of the following is considered Personal Data under GDPR?",
    opts: [
      "The birth date of an unidentified user.",
      "An individual's address including their first and last name.",
      "The name of a deceased individual.",
      "A company's registration number."
    ],
    ans: 1,
    exp: "Under GDPR, personal data is any information that can identify a living natural person. An individual's address combined with their name directly identifies a living person. A birth date alone without identification, a deceased person's name, or a company number do not qualify."
  },
  {

    q: "During their shift, an analyst receives an alert about an executable being run from C:\\Windows\\Temp. Why should this be investigated further?",
    opts: [
      "Temp directories aren't owned by any particular user, making it difficult to track the process owner when files are executed.",
      "Temp directories are flagged as non-executable, meaning that no files stored within can be executed, and this executable was run from that directory.",
      "Temp directories contain the system page file and the virtual memory file, meaning the attacker can use their malware to read the in memory values of running programs.",
      "Temp directories are world writable thus allowing attackers a place to drop, stage, and execute malware on a system without needing to worry about file permissions."
    ],
    ans: 3,
    exp: "C:\\Windows\\Temp (and %TEMP%) directories are writable by all users, making them a common staging ground for attackers. Malware dropped and executed from Temp directories bypasses the need for elevated write permissions to protected system folders, which is a well-known attacker technique."
  },
  {
    q: "An analyst would like to visualize threat objects across their environment and chronological risk events for a Risk Object in Incident Review. Where would they find this?",
    opts: [
      "Running the Risk Analysis Adaptive Response action within the Notable Event.",
      "Via a workflow action for the Risk Investigation dashboard.",
      "Via the Risk Analysis dashboard under the Security Intelligence tab in Enterprise Security.",
      "Clicking the risk event count to open the Risk Event Timeline."
    ],
    ans: 3,
    exp: "Within Incident Review in Splunk ES, clicking on a risk event count for a Risk Object opens the Risk Event Timeline — a chronological view of all risk-contributing events for that entity. This helps analysts understand the sequence and pattern of suspicious activities."
  },
  {
    q: "A Risk Rule generates events on Suspicious Cloud Share Activity and regularly contributes to confirmed incidents from Risk Notables. An analyst realizes the raw logs these events are generated from contain information which helps them determine what might be malicious.\n\nWhat should they ask their engineer for to make their analysis easier?",
    opts: [
      "Create a field extraction for this information.",
      "Add this information to the risk message.",
      "Create another detection for this information.",
      "Allowlist more events based on this information."
    ],
    ans: 0,
    exp: "When raw log data contains useful but unparsed information, creating a field extraction allows Splunk to surface that data as a structured, searchable field. This makes it immediately visible in Notable Events and investigation workflows without requiring analysts to parse raw text manually."
  },
  {
    q: "What device typically sits at a network perimeter to detect command and control and other potentially suspicious traffic?",
    opts: [
      "Host-based firewall",
      "Web proxy",
      "Endpoint Detection and Response",
      "Intrusion Detection System"
    ],
    ans: 3,
    exp: "An Intrusion Detection System (IDS) is specifically designed to monitor network traffic at the perimeter for known attack signatures and anomalies, including C2 communication patterns. A host-based firewall operates locally, a web proxy filters web traffic, and EDR monitors endpoint behavior."
  },
  {
    q: "Upon investigating a report of a web server becoming unavailable, the security analyst finds that the web server's access log has the same log entry millions of times:\n\n147.186.119.200 - - [28/Jul/2023:12:04:13 -0300] \"GET /login/ HTTP/1.0\" 200 3733\n\nWhat kind of attack is occurring?",
    opts: [
      "Denial of Service Attack",
      "Distributed Denial of Service Attack",
      "Cross-Site Scripting Attack",
      "Database Injection Attack"
    ],
    ans: 1,
    exp: "Millions of identical requests overwhelming a web server indicate a volumetric attack. The scale of the attack (millions of requests) suggests it originates from multiple distributed sources (a botnet), making this a Distributed Denial of Service (DDoS) attack rather than a single-source DoS."
  },
  {
    q: "According to David Bianco's Pyramid of Pain, which indicator type is least effective when used in continuous monitoring?",
    opts: ["Domain names","TTPs","NetworM-lost artifacts","Hash values"],
    ans: 3,
    exp: "At the base of Bianco's Pyramid of Pain, hash values are the easiest for attackers to change (recompile or modify the malware) and therefore the least effective for defenders. TTPs are at the top — the hardest for attackers to change and most effective for defenders."
  }
];

// ─── SHUFFLE SETTINGS ───────────────────────────────────────────────────────
let shuffleMode     = false;
let shuffleQuestions = true;   // whether to shuffle question order
let shuffleChoices   = true;   // whether to shuffle answer choices

// ─── ACTIVE QUESTION SET (built on each shuffle apply) ──────────────────────
let questions = masterQuestions.slice(); // starts as ordered copy

// ─── STATE ──────────────────────────────────────────────────────────────────
let current = 0;
let userAnswers = new Array(questions.length).fill(null);
let score = 0;
let answered = 0;

// ─── FISHER-YATES SHUFFLE ───────────────────────────────────────────────────
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── BUILD ACTIVE QUESTION SET ──────────────────────────────────────────────
function buildQuestionSet() {
  let pool = masterQuestions.map((q, origIdx) => ({
    origIdx,
    q: q.q,
    opts: q.opts.slice(),
    ans: q.ans,
    exp: q.exp
  }));

  // Shuffle question order
  if (shuffleMode && shuffleQuestions) {
    pool = shuffleArray(pool);
  }

  // Shuffle choices per question
  if (shuffleMode && shuffleChoices) {
    pool = pool.map(q => {
      const correctText = q.opts[q.ans];
      const indices = q.opts.map((_, i) => i);
      const shuffledIndices = shuffleArray(indices);
      const newOpts = shuffledIndices.map(i => q.opts[i]);
      const newAns = newOpts.indexOf(correctText);
      return { ...q, opts: newOpts, ans: newAns };
    });
  }

  return pool;
}

// ─── SHUFFLE TOGGLE UI ───────────────────────────────────────────────────────
function toggleShuffle() {
  shuffleMode = !shuffleMode;
  const toggle = document.getElementById('shuffle-toggle');
  const text   = document.getElementById('toggle-text');
  const reshuffleBtn = document.getElementById('btn-reshuffle');
  const optBtns = document.querySelectorAll('.shuffle-opt-btn');

  if (shuffleMode) {
    toggle.classList.add('on');
    text.textContent = 'ON';
    reshuffleBtn.style.display = 'inline';
    optBtns.forEach(b => b.disabled = false);
  } else {
    toggle.classList.remove('on');
    text.textContent = 'OFF';
    reshuffleBtn.style.display = 'none';
    optBtns.forEach(b => b.disabled = false);
  }
  applyShuffleAndRestart();
}

function toggleShuffleOpt(type) {
  if (type === 'questions') {
    shuffleQuestions = !shuffleQuestions;
    document.getElementById('opt-questions').classList.toggle('active', shuffleQuestions);
  } else {
    shuffleChoices = !shuffleChoices;
    document.getElementById('opt-choices').classList.toggle('active', shuffleChoices);
  }
  if (shuffleMode) applyShuffleAndRestart();
}

function applyShuffleAndRestart() {
  questions = buildQuestionSet();
  userAnswers = new Array(questions.length).fill(null);
  score = 0;
  answered = 0;
  current = 0;

  // Update total label
  document.querySelector('.subtitle').textContent =
    `// ${questions.length} questions · Cybersecurity Defense Analyst` +
    (shuffleMode ? ' · SHUFFLED' : '');

  renderQuestion(0);
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderQuestion(idx) {
  const q = questions[idx];
  const label = `QUESTION ${String(idx+1).padStart(2,'0')}`;
  const pill  = shuffleMode
    ? `<span class="shuffle-pill">shuffled</span>`
    : '';
  document.getElementById('q-num-label').innerHTML = label + pill;
  document.getElementById('q-current').textContent = idx + 1;

  // Format question text
  let qText = q.q;
  qText = qText.replace(/\n((?:index=|eval |stats |rex |makeresults|147\.\d|\|)[^\n]+)/g,
    (m, p1) => `\n<code>${p1}</code>`);
  qText = qText.replace(/\n(\d+\. )/g, '\n$1');
  document.getElementById('q-text').innerHTML = qText.split('\n').join('<br>');

  // Options
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.idx = i;
    div.innerHTML = `<span class="option-letter">${letters[i]}.</span><span>${opt}</span>`;

    if (userAnswers[idx] !== null) {
      div.classList.add('locked');
      if (i === q.ans)            div.classList.add('correct');
      else if (i === userAnswers[idx]) div.classList.add('wrong');
    } else {
      div.onclick = () => selectAnswer(idx, i);
    }
    optsEl.appendChild(div);
  });

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
  if (userAnswers[idx] !== null) {
    const correct = userAnswers[idx] === q.ans;
    fb.className = 'feedback ' + (correct ? 'correct-fb' : 'wrong-fb');
    fb.innerHTML = (!correct
      ? `Correct answer: <strong>${letters[q.ans]}. ${q.opts[q.ans]}</strong><br><br>`
      : '') + q.exp;
  }

  // Nav
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled =
    userAnswers[idx] === null || idx === questions.length - 1;
  document.getElementById('btn-skip').style.display =
    (userAnswers[idx] === null && idx < questions.length - 1) ? 'inline' : 'none';

  // Progress
  const pct = ((idx + 1) / questions.length * 100).toFixed(1);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('score-live').textContent  = score;
  document.getElementById('answered-live').textContent = answered;

  // Card animation
  const card = document.getElementById('card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeSlide 0.3s ease';
}

// ─── INTERACTIONS ────────────────────────────────────────────────────────────
function selectAnswer(qIdx, choiceIdx) {
  if (userAnswers[qIdx] !== null) return;
  userAnswers[qIdx] = choiceIdx;
  answered++;
  if (choiceIdx === questions[qIdx].ans) score++;
  renderQuestion(qIdx);
}

function goQuestion(idx) {
  if (idx < 0 || idx >= questions.length) return;
  current = idx;
  renderQuestion(current);
}

function skipQuestion() {
  if (current < questions.length - 1) goQuestion(current + 1);
}

// ─── FINISH ──────────────────────────────────────────────────────────────────
function finishQuiz() {
  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('results-screen');
  rs.style.display = 'block';

  const total   = questions.length;
  const skipped = total - answered;
  const pct     = Math.round(score / total * 100);
  const passing = pct >= 70;

  document.getElementById('score-pct').textContent   = pct + '%';
  document.getElementById('r-correct').textContent   = score;
  document.getElementById('r-wrong').textContent     = answered - score;
  document.getElementById('r-skipped').textContent   = skipped;
  document.getElementById('result-title').textContent = passing ? 'Well Done!' : 'Keep Practicing';
  document.getElementById('result-sub').textContent  =
    `// ${score} correct out of ${total} questions` +
    (shuffleMode ? ' · shuffled mode' : '');

  const ring = document.getElementById('score-ring');
  ring.classList.toggle('bad', !passing);
  setTimeout(() => {
    const circumference = 2 * Math.PI * 70;
    const fill = (pct / 100) * circumference;
    document.getElementById('score-circle').style.strokeDasharray = `${fill} ${circumference}`;
  }, 100);

  // Review missed questions
  const rl = document.getElementById('review-list');
  rl.innerHTML = '<h3 style="font-size:16px;letter-spacing:2px;margin-bottom:16px;color:var(--muted);font-family:var(--mono);">// Review Missed Questions</h3>';
  const letters = ['A','B','C','D'];
  let hasMissed = false;

  questions.forEach((q, i) => {
    const ua = userAnswers[i];
    if (ua === q.ans) return;
    hasMissed = true;
    const div = document.createElement('div');
    div.className = 'review-item ' + (ua === null ? 'r-wrong' : 'r-wrong');
    const shortQ = q.q.split('\n')[0].substring(0, 100) + (q.q.length > 100 ? '...' : '');
    div.innerHTML = `
      <div class="review-q-num">Q${String(i+1).padStart(2,'0')} · ${ua === null ? 'SKIPPED' : 'INCORRECT'}</div>
      <div class="review-q-text">${shortQ}</div>
      <div class="review-answers">
        ${ua !== null ? `<span class="ry">Your answer: ${letters[ua]}. ${q.opts[ua]}</span><br>` : ''}
        <span class="rc">✔ Correct: ${letters[q.ans]}. ${q.opts[q.ans]}</span>
      </div>`;
    rl.appendChild(div);
  });

  if (!hasMissed) {
    rl.innerHTML += '<p style="text-align:center;color:var(--correct);font-family:var(--mono);font-size:13px;">// Perfect score — no questions to review!</p>';
  }
}

// ─── RESTART ─────────────────────────────────────────────────────────────────
function restartQuiz() {
  // Re-apply shuffle if active, otherwise reset to original order
  questions = buildQuestionSet();
  userAnswers = new Array(questions.length).fill(null);
  score = 0;
  answered = 0;
  current = 0;

  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('score-circle').style.strokeDasharray = '0 440';
  renderQuestion(0);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderQuestion(0);
</script>
